<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Portail Matériel
    </title>

</head>

<body>

    <script>

        const token = sessionStorage.getItem(
            "access_token"
        );

        if (token) {
            window.location.href = (
                "dashboard.html"
            );
        } else {
            window.location.href = (
                "login.html"
            );
        }

    </script>

</body>

</html>
